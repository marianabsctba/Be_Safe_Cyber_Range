<svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#0b0d0f}.topo-lines path{fill:none;stroke:rgba(243,241,236,.35);stroke-width:2;stroke-dasharray:4 5}.topo-box rect{fill:#101317;stroke:rgba(243,241,236,.35);stroke-width:1.5}.topo-box text{fill:#f3f1ec;font:700 13px Arial,sans-serif;text-anchor:middle}.topo-box text.sub{fill:#b8b7b2;font-size:10px;font-weight:500}.topo-box text.tiny{fill:#777b80;font-size:8px;font-weight:500}.topo-box.edge rect{stroke:#ff3d98}.topo-box.security rect{stroke:#caff33}.topo-box.cyan rect{stroke:#3de7ff}.topo-box.cloud rect{stroke:#9e62ff}.topo-box.vlan rect{stroke:#65717a}.topo-box.small rect{stroke:#555b61}
</style>
            <title>Topologia canônica da Be Safe Corp. Inc.</title>
            <desc>Internet redundante conecta edge routers e firewalls NGFW em HA. A partir deles há DMZ e core layer 3, que segmenta Financeiro, RH, rede corporativa, servidores, SOC e gerenciamento. Filiais chegam por SD-WAN e AWS/Azure por VPN. Todas as fontes enviam telemetria ao Wazuh e OpenSearch, com Velociraptor e OpenCTI/MISP.</desc>
